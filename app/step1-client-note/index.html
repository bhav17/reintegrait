<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ReintegrAIt Client Note</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: same case-file workspace as the ReturnPath prototype. Sticky header, one view at a time (home, clients, processing, note), modals for uploads. */
:root{
  --bg:#f3f5f7; --panel:#ffffff; --ink:#18222d; --muted:#5b6876; --line:#d9dfe5;
  --accent:#1f5f8b; --accent-soft:#e3eef6; --sim:#7a6a52; --sim-soft:#f4efe6;
  --ok:#2e7d4f; --ok-soft:#e3f2e8; --warn:#9a6400; --warn-soft:#fbf0d9; --bad:#a63d3d; --bad-soft:#f8e4e4;
  --hl:#fff2b8; --scrim:rgba(16,24,32,.45);
  --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11171d; --panel:#19212a; --ink:#e4e9ee; --muted:#9aa7b4; --line:#2c3743;
  --accent:#7db4dc; --accent-soft:#1d3346; --sim:#cbb48e; --sim-soft:#2f2a21;
  --ok:#7ccb9a; --ok-soft:#1a3326; --warn:#e2b55a; --warn-soft:#352a14; --bad:#e58f8f; --bad-soft:#3a1f1f; --hl:#4a4116; --scrim:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11171d; --panel:#19212a; --ink:#e4e9ee; --muted:#9aa7b4; --line:#2c3743;
  --accent:#7db4dc; --accent-soft:#1d3346; --sim:#cbb48e; --sim-soft:#2f2a21;
  --ok:#7ccb9a; --ok-soft:#1a3326; --warn:#e2b55a; --warn-soft:#352a14; --bad:#e58f8f; --bad-soft:#3a1f1f; --hl:#4a4116; --scrim:rgba(0,0,0,.6); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--panel);border-bottom:1px solid var(--line)}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:8px 20px;padding-block:12px}
.brand{font-weight:700;font-size:18px;letter-spacing:-.01em;background:none;border:0;color:var(--ink);font-family:inherit;cursor:pointer;padding:0}
.brand small{font-weight:500;color:var(--muted);font-size:13px;margin-left:6px}
nav.main{display:flex;gap:4px}
nav.main button{font:inherit;font-size:14px;background:none;border:0;border-bottom:3px solid transparent;color:var(--muted);padding:6px 10px;cursor:pointer}
nav.main button[aria-current="page"]{color:var(--ink);border-color:var(--accent);font-weight:600}
.who{margin-left:auto;font-size:13px;color:var(--muted)}
.who b{color:var(--ink)}
main{padding-block:20px 56px}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:3px;white-space:nowrap}
.tag.sim{color:var(--sim);background:var(--sim-soft);border:1px dashed var(--sim)}
.tag.ok{color:var(--ok);background:var(--ok-soft)}
.tag.warn{color:var(--warn);background:var(--warn-soft)}
.tag.bad{color:var(--bad);background:var(--bad-soft)}
.tag.info{color:var(--accent);background:var(--accent-soft)}
h1{font-size:26px;margin:0;letter-spacing:-.01em;text-wrap:balance}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 10px;font-weight:600;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
h3{font-size:16px;margin:0;text-wrap:balance}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.mono{font-family:var(--f-mono);font-size:12px}
.pane{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px 18px;min-width:0}
.btn{font:inherit;font-size:14px;font-weight:600;padding:8px 14px;border-radius:5px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--panel)}
.btn.ghost{border-color:transparent;background:none;color:var(--accent);padding-inline:6px}
.btn:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[contenteditable]:focus-visible,tr[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btns{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.mockbar{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:16px}

/* Home */
.hello{display:flex;flex-direction:column;gap:4px;margin-bottom:20px}
.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-bottom:24px}
@media (max-width:640px){.choices{grid-template-columns:1fr}}
.choice{font:inherit;text-align:left;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:22px 22px 20px;cursor:pointer;display:flex;flex-direction:column;gap:6px;transition:border-color .15s}
.choice:hover{border-color:var(--accent)}
.choice .ic{width:40px;height:40px;border-radius:8px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;margin-bottom:6px}
.choice b{font-size:20px}
.choice span{color:var(--muted);font-size:14px}
.homegrid{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:20px}
@media (max-width:860px){.homegrid{grid-template-columns:1fr}}
.rem{display:flex;flex-direction:column}
.rem button{font:inherit;color:var(--ink);text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:10px 2px;display:grid;grid-template-columns:76px 1fr auto;gap:10px;align-items:center;cursor:pointer}
.rem button:first-child{border-top:0}
.rem button:hover .rn{color:var(--accent)}
.rem .rd{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.rem .rn{font-weight:600}
.rem .rt{font-size:13px;color:var(--muted);display:block}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat b{display:block;font-size:24px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}

/* Clients */
.clients{display:grid;grid-template-columns:minmax(0,6fr) minmax(0,5fr);gap:20px;align-items:start}
@media (max-width:900px){.clients{grid-template-columns:1fr}}
.search{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.search input{flex:1;min-width:0;font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:5px;background:var(--panel);color:var(--ink)}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--bg)}
tbody tr[aria-selected="true"] td{background:var(--accent-soft)}
td .sub{display:block;font-size:12px;color:var(--muted)}
.due{font-family:var(--f-mono);font-size:12px;white-space:nowrap}
.due.over{color:var(--bad)} .due.today{color:var(--warn)}
.detail{position:sticky;top:120px}
@media (max-width:900px){.detail{position:static}}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 16px;margin-block:12px}
.kv div span{display:block;font-size:12px;color:var(--muted)}
.kv div b{font-weight:600;font-size:14px}
.timeline{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.timeline li{display:grid;grid-template-columns:58px 1fr;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.timeline li.new{background:var(--ok-soft);margin-inline:-8px;padding-inline:8px;border-radius:4px}
.timeline .d{font-family:var(--f-mono);font-size:12px;color:var(--muted);padding-top:2px}
.timeline .t{font-size:12px;font-weight:600;color:var(--accent)}
.timeline p{font-size:14px}
.remcard{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;padding:10px 12px;border-radius:5px;background:var(--warn-soft);font-size:14px;margin-block:12px;flex-wrap:wrap}
.remcard.calm{background:var(--accent-soft)}

/* Modal */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:20;display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));overflow-y:auto}
.modal{background:var(--panel);border-radius:8px;width:100%;max-width:560px;padding:20px 22px;display:flex;flex-direction:column;gap:14px;box-shadow:0 12px 40px rgba(0,0,0,.25)}
.modal header{position:static;border:0;padding:0;display:flex;justify-content:space-between;gap:12px;align-items:flex-start;background:none}
.x{font:inherit;font-size:20px;line-height:1;background:none;border:0;color:var(--muted);cursor:pointer;padding:2px 6px}
.drop{border:2px dashed var(--line);border-radius:8px;padding:22px 16px;text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center;cursor:pointer;transition:border-color .15s,background .15s}
.drop.over,.drop:hover{border-color:var(--accent);background:var(--accent-soft)}
.drop b{font-size:15px}
.limits{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;font-size:12px}
@media (max-width:480px){.limits{grid-template-columns:1fr}}
.limits div{background:var(--bg);border-radius:5px;padding:8px 10px}
.limits b{display:block;font-size:14px}
.file{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:6px;font-size:14px}
.file .meta{flex:1;min-width:0}
.file .nm{font-weight:600;overflow-wrap:anywhere}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s linear}
.or{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
textarea,select,.field input{font:inherit;font-size:14px;width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:5px;background:var(--panel);color:var(--ink)}
textarea{min-height:84px;resize:vertical}
label.chk{display:flex;gap:8px;align-items:flex-start;font-size:14px;cursor:pointer}
label.chk input{margin-top:3px;accent-color:var(--accent)}
.field{display:flex;flex-direction:column;gap:4px;font-size:13px}
.field>span{color:var(--muted)}

/* Processing */
.proc{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.stages{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.stages li{display:grid;grid-template-columns:28px 1fr;gap:12px;padding:14px 0;border-top:1px solid var(--line)}
.stages li:first-child{border-top:0}
.dot{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--muted)}
li.run .dot{border-color:var(--accent);border-top-color:transparent;animation:spin .8s linear infinite}
li.done .dot{background:var(--ok);border-color:var(--ok);color:var(--panel)}
li.flag .dot{background:var(--warn);border-color:var(--warn);color:var(--panel)}
li.skip .dot{border-style:dashed}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){li.run .dot{animation:none;border-top-color:var(--accent)}}
.stages b{display:block}
.stages .res{font-size:13px;color:var(--muted);margin-top:2px}
.stages li.wait b{color:var(--muted);font-weight:500}

/* Note */
.notehead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px;margin-bottom:16px}
.notegrid{display:grid;grid-template-columns:minmax(0,4fr) minmax(0,6fr) minmax(0,3fr);gap:16px;align-items:start}
@media (max-width:1100px){.notegrid{grid-template-columns:minmax(0,5fr) minmax(0,7fr)}.review{grid-column:1/-1}}
@media (max-width:760px){.notegrid{grid-template-columns:1fr}}
.tx{display:flex;flex-direction:column;gap:2px;font-size:14px;max-height:620px;overflow-y:auto}
.tx div{display:grid;grid-template-columns:64px 1fr;gap:8px;padding:5px 6px;border-radius:4px;scroll-margin:40px}
.tx div.on{background:var(--hl)}
.tx .ts{font-family:var(--f-mono);font-size:12px;color:var(--muted);padding-top:1px}
.tx .sp{font-weight:600;font-size:13px;margin-right:4px}
.tx .gap{color:var(--bad);font-style:italic}
.note section{border-top:1px solid var(--line);padding-block:12px}
.note section:first-of-type{border-top:0;padding-top:0}
.note h4{margin:0 0 8px;font-size:13px;font-weight:700;letter-spacing:.03em;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.keyinfo{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 14px}
@media (max-width:480px){.keyinfo{grid-template-columns:1fr}}
.keyinfo label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
.keyinfo input,.keyinfo select{font:inherit;font-size:14px;color:var(--ink);background:transparent;border:1px solid transparent;border-radius:4px;padding:5px 6px;margin-left:-7px;width:100%}
.editing .keyinfo input,.editing .keyinfo select{border-color:var(--line);background:var(--panel);margin-left:0}
.keyinfo .flagged input,.keyinfo .flagged select{background:var(--warn-soft);border-color:var(--warn)}
.keyinfo select:disabled,.keyinfo input:read-only{opacity:1;cursor:default;appearance:none}
.items{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.items li{display:flex;gap:8px;align-items:baseline}
.items .txt{flex:1;min-width:0;border-radius:3px;padding:1px 3px;margin-left:-3px}
.editing .items .txt{outline:1px dashed var(--line)}
.items .txt:focus{background:var(--accent-soft);outline:none}
.pri{font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:1px 5px;border-radius:3px;white-space:nowrap}
.pri.u{color:var(--bad);background:var(--bad-soft)} .pri.s{color:var(--warn);background:var(--warn-soft)} .pri.l{color:var(--muted);background:var(--bg)}
.src{font-family:var(--f-mono);font-size:11px;color:var(--accent);cursor:pointer;border:0;background:none;padding:0;white-space:nowrap}
.del{display:none;border:0;background:none;color:var(--bad);cursor:pointer;font-size:16px;line-height:1;padding:0 4px}
.editing .del{display:inline}
.add{display:none;margin-top:6px}
.editing .add{display:inline-block}
.flags{display:flex;flex-direction:column;gap:8px}
.flagitem{border-left:3px solid var(--warn);background:var(--warn-soft);border-radius:4px;padding:8px 10px;font-size:13px;display:flex;flex-direction:column;gap:6px}
.flagitem.res{border-color:var(--ok);background:var(--ok-soft)}
.flagitem .row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.flagitem input,.flagitem select{font:inherit;font-size:13px;padding:4px 6px;border:1px solid var(--line);border-radius:4px;background:var(--panel);color:var(--ink);flex:1;min-width:120px}
.checks{display:flex;flex-direction:column;gap:10px;margin-block:10px 14px}
.auto{display:flex;gap:8px;font-size:14px;align-items:flex-start}
.auto i{font-style:normal;font-weight:700;width:16px;text-align:center}
.auto.y i{color:var(--ok)} .auto.n i{color:var(--warn)}
.diff{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;font-size:14px}
.diff li{display:grid;grid-template-columns:70px 1fr;gap:8px}
.diff .k{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding-top:2px}
.diff .k.add{color:var(--ok)} .diff .k.chg{color:var(--accent)} .diff .k.rem{color:var(--muted)}
.diff s{color:var(--muted)}
.flagbar{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.flagbar .flagitem{flex-direction:row;flex-wrap:wrap;align-items:center;gap:6px 12px}
.flagbar .flagitem>div{flex:1;min-width:220px}
.flagbar .flagitem>.row{flex:0 1 360px}
.flagitem .ic{font-weight:700}
.rem .row button{display:inline;grid-template-columns:none;border-top:0;padding:0;width:auto}
.rem .row .btn{padding:6px 12px;border:1px solid var(--line);white-space:nowrap}
.rem .row{display:grid;grid-template-columns:118px minmax(0,1fr) auto;gap:10px;align-items:center;border-top:1px solid var(--line);padding:10px 2px}
.rem .row:first-child{border-top:0}
.rem .rn{font:inherit;font-weight:600;background:none;border:0;padding:0;color:var(--ink);cursor:pointer;text-align:left}
.rem .rn:hover{color:var(--accent);text-decoration:underline}
.items .pri-sel{width:auto;flex:none;padding:1px 2px;font:inherit;font-size:11px;font-weight:700;text-transform:uppercase;border:1px solid var(--line);border-radius:3px;padding:1px 2px;background:var(--panel);color:var(--ink)}
.consent{font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ok);background:var(--ok-soft);border-radius:3px;padding:0 5px;margin-left:6px;white-space:nowrap}
.log{width:100%;font-size:13px}
.log td{vertical-align:top}
.log .when{font-family:var(--f-mono);font-size:12px;color:var(--muted);white-space:nowrap}
.log .ev{font-weight:600;white-space:nowrap}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.metrics div{background:var(--bg);border-radius:5px;padding:8px 10px}
.metrics b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.metrics span{font-size:12px;color:var(--muted)}
.stepgrp{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin:10px 0 6px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.stepgrp:first-of-type{margin-top:0}
.steps li{display:grid;grid-template-columns:20px minmax(0,1fr) auto;gap:4px 8px;align-items:start}
.steps li input[type=checkbox]{margin-top:4px;accent-color:var(--accent)}
.steps .meta{grid-column:2/-1;font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center}
.steps .meta select,.steps .meta input{font:inherit;font-size:12px;padding:1px 4px;border:1px solid var(--line);border-radius:3px;background:var(--panel);color:var(--ink);width:auto}
.steps li.off .txt{color:var(--muted)}
.tag.sug{color:var(--sim);background:var(--sim-soft);border:1px dashed var(--sim)}
.nosteps{font-size:14px;padding:6px 10px;border-radius:4px;background:var(--warn-soft)}
.stype{font:inherit;font-size:12px;padding:1px 4px;border:1px solid var(--line);border-radius:4px;background:var(--panel);color:var(--ink);max-width:150px}
.stype.missing{border-color:var(--warn);background:var(--warn-soft)}
.svclog{border-top:1px solid var(--line);padding-top:12px;margin-top:4px;display:flex;flex-direction:column;gap:10px}
.logrow{display:grid;grid-template-columns:minmax(0,1fr) 84px;gap:8px}
.svcs{border:0;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.svcs legend{font-size:13px;color:var(--muted);margin-bottom:4px;padding:0}
.svcs label{display:inline-flex;gap:4px;align-items:center;font-size:13px;border:1px solid var(--line);border-radius:14px;padding:2px 9px;cursor:pointer}
.svcs label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.svcs input{accent-color:var(--accent);margin:0}
.dosage{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted);margin:-4px 0 12px}
.dosage b{color:var(--ink);font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:10px 16px;border-radius:6px;font-size:14px;z-index:30;max-width:calc(100% - 32px)}
</style>

<header>
  <div class="wrap top">
    <button class="brand" id="brand" type="button">ReintegrAIt <small>Step 1 · Client note</small></button>
    <nav class="main" aria-label="Main">

<script>
/* ReintegrAIt Step 1 prototype.
   - Client records live in a small record store (below), saved in this browser only. No server, no login.
   - Every simulated AI response, and the note templates, are loaded from simulated_responses.json. */
const TODAY = new Date(2026,10,11);
const MONTHS=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const parseDate=s=>{const [y,m,dd]=s.split("-").map(Number);return new Date(y,m-1,dd)};
const iso=dt=>dt.getFullYear()+"-"+String(dt.getMonth()+1).padStart(2,"0")+"-"+String(dt.getDate()).padStart(2,"0");
const TODAY_ISO=iso(TODAY);
const fmt=dt=>MONTHS[dt.getMonth()]+" "+dt.getDate();
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const dayDiff=dt=>Math.round((dt-TODAY)/864e5);
const clone=o=>JSON.parse(JSON.stringify(o));
const fill=(o,vars)=>JSON.parse(JSON.stringify(o).replace(/\{(first|duration)\}/g,(m,k)=>vars[k]??m));

/* ---------- Records ----------
   Seven record types. Names follow Salesforce Nonprofit Cloud so an export maps cleanly later:
   Client       one person served (Salesforce: Account / Contact)
   Interaction  a visit, call, text or intake note, with meeting type and minutes (Interaction + InteractionSummary)
   Need         an open need found in a note, tagged with a service type (care plan need)
   Service      a service delivered in an interaction: type and minutes, for dosage reporting (BenefitDisbursement)
   Goal         a next step or a dated reminder (GoalAssignment). Reminders are open Goals with a due date.
   Referral     a referral sent to a partner (Referral). Statuses grow in step 4.
   Approval     who approved which note, and when (audit log)
   Everything is saved to localStorage under STORE_KEY. "Reset sample data" puts the five sample clients back. */
const STORE_KEY="reintegrait.records.v2";
const RECORD_TYPES=["Client","Interaction","Need","Service","Goal","Referral","Approval"];
const uid=t=>t.slice(0,3).toLowerCase()+"-"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);

const SAMPLE_CLIENTS=[
 {id:"c1",name:"Marcus Reed",age:41,gender:"Male",locality:"Austin",phone:"773-555-0142",since:"2026-10-02",status:"Referral pending",
  needs:[["Job readiness program","Jobs"],["Steady housing (staying with sister)","Housing"]],
  reminder:{date:"2026-11-11",type:"Referral check",text:"Did Marcus attend the Cara Collective orientation on Tue Nov 10?"},
  entries:[{date:"2026-11-03",type:"Referral sent",text:"Referred to Cara Collective job readiness. Orientation Tue Nov 10, 9am.",referral:{partner:"Cara Collective",service:"Job readiness"},mt:"Phone call",min:10,svc:["Jobs"]},
           {date:"2026-10-20",type:"Second visit",text:"Has state ID now. Wants warehouse work. Sister's place is stable through December.",mt:"In-person visit",min:30,svc:["Jobs","Housing"]},
           {date:"2026-10-02",type:"Intake note",text:"Released Sep 28 from Stateville. Needs ID, job, and SNAP.",mt:"In-person visit",min:55,svc:["ID and documents","Jobs","Benefits"]}]},
 {id:"c2",name:"Tanya Brooks",age:29,gender:"Female",locality:"Roseland",phone:"312-555-0178",since:"2026-09-14",status:"Active",

           {date:"2026-10-08",type:"Second visit",text:"SNAP approved. Interested in GED.",mt:"In-person visit",min:25,svc:["Benefits"]},
           {date:"2026-09-14",type:"Intake note",text:"Released Sep 9 from Logan. Two kids staying with her mother.",mt:"In-person visit",min:50,svc:["Benefits","Family"]}]},
 {id:"c3",name:"Luis Herrera",age:52,gender:"Male",locality:"Little Village",phone:"773-555-0119",since:"2026-10-21",status:"Needs follow-up",
  needs:[["Housing application paperwork","Housing"],["Diabetes care","Health"]],

  entries:[{date:"2026-10-21",type:"Intake note",text:"Released Oct 15. In a shelter. Needs a clinic for diabetes medication.",mt:"In-person visit",min:45,svc:["Housing","Health"]}]},
 {id:"c4",name:"Keisha Moore",age:36,gender:"Female",locality:"North Lawndale",phone:"872-555-0163",since:"2026-08-30",status:"Active",
  needs:[["Driver's license reinstatement","Legal"]],
  reminder:{date:"2026-11-16",type:"Weekly message check",text:"Text check-in about the license hearing date."},
  entries:[{date:"2026-11-09",type:"Weekly message check",text:"Working at a restaurant 30 hrs/week. Hearing date not set yet.",mt:"Text message",min:5,svc:["Legal"]},

 {id:"c5",name:"James Carter",age:24,gender:"Male",locality:"Humboldt Park",phone:"773-555-0127",since:"2026-10-28",status:"Referral pending",
  needs:[["Job training","Jobs"],["Phone (lost his)","Benefits"]],

  entries:[{date:"2026-11-05",type:"Referral sent",text:"Referred to Safer Foundation job training. Start date Nov 18.",referral:{partner:"Safer Foundation",service:"Job training"},mt:"Phone call",min:12,svc:["Jobs"]},

];

/* Turn the sample clients into records. Entries are added oldest first so the store reads like a real history. */
function sampleRecords(){
 const R={};RECORD_TYPES.forEach(t=>R[t]=[]);
 let n=0;const id=p=>p+"-s"+(++n);
 SAMPLE_CLIENTS.forEach(s=>{
  R.Client.push({Id:s.id,Name:s.name,Age:s.age,Gender:s.gender,Locality:s.locality,Phone:s.phone,ClientSince:s.since,Status:s.status});
  s.needs.forEach(([t,st])=>R.Need.push({Id:id("nee"),ClientId:s.id,Text:t,ServiceType:st,Priority:"Soon",Status:"Open",CreatedDate:s.since,InteractionId:null}));
  s.entries.slice().reverse().forEach(e=>{const iid=id("int");
   R.Interaction.push({Id:iid,ClientId:s.id,Date:e.date,Type:e.type,Summary:e.text,Channel:"Sample",Template:null,SourceName:null,MeetingType:e.mt,Minutes:e.min});
   splitMinutes(e.min,e.svc).forEach(([st,m])=>R.Service.push({Id:id("ser"),ClientId:s.id,InteractionId:iid,Date:e.date,ServiceType:st,Minutes:m,MeetingType:e.mt}));
   if(e.referral)R.Referral.push({Id:id("ref"),ClientId:s.id,InteractionId:iid,Partner:e.referral.partner,Service:e.referral.service,Status:"Sent",SentDate:e.date});
  });
  R.Goal.push({Id:id("goa"),ClientId:s.id,Text:s.reminder.text,Type:s.reminder.type,DueDate:s.reminder.date,Status:"Open",InteractionId:null});
 });
 return R;
}

const Store={
 data:null,
 load(){let d=null;try{d=JSON.parse(localStorage.getItem(STORE_KEY))}catch(e){}
  this.data=d&&RECORD_TYPES.every(t=>Array.isArray(d[t]))?d:sampleRecords();this.save()},
 save(){try{localStorage.setItem(STORE_KEY,JSON.stringify(this.data))}catch(e){}},
 reset(){this.data=sampleRecords();this.save()},
 all(t){return this.data[t]},
 where(t,f){return this.data[t].filter(f)},
 get(t,id){return this.data[t].find(r=>r.Id===id)},
 insert(t,rec,atFront){const r={Id:uid(t),...rec};this.data[t][atFront?"unshift":"push"](r);return r},
 update(t,id,patch){Object.assign(this.get(t,id),patch)},
};

/* The screens read a client "view": the client plus its open needs, next reminder and case file, built from the records. */
function clientView(c){
 const due=Store.where("Goal",g=>g.ClientId===c.Id&&g.Status==="Open"&&g.DueDate).sort((a,b)=>a.DueDate.localeCompare(b.DueDate))[0];
 return{id:c.Id,name:c.Name,age:c.Age,gender:c.Gender,locality:c.Locality,phone:c.Phone,since:parseDate(c.ClientSince),status:c.Status,
  needs:Store.where("Need",x=>x.ClientId===c.Id&&x.Status==="Open").map(x=>x.Text),
  needTypes:Store.where("Need",x=>x.ClientId===c.Id&&x.Status==="Open").map(x=>x.ServiceType||""),
  reminder:due?{goalId:due.Id,date:parseDate(due.DueDate),type:due.Type,text:due.Text}:null,
  entries:Store.where("Interaction",x=>x.ClientId===c.Id).reverse().sort((a,b)=>b.Date.localeCompare(a.Date)).map(x=>({date:parseDate(x.Date),type:x.Type,text:x.Summary}))};
}
const clients=()=>Store.all("Client").map(clientView);

/* ---------- Dosage (step 2) ----------
   Every interaction logs a meeting type and minutes. Its minutes are split evenly across the service types it covered,
   one Service record per type. That gives the dosage funders ask for: contacts, minutes, and breadth of service types. */
function splitMinutes(total,types){const n=types.length;if(!n)return[];const each=Math.floor(total/n);return types.map((t,i)=>[t,each+(i<total-each*n?1:0)])}
function logServices(clientId,it,types){splitMinutes(it.Minutes,types).forEach(([st,m])=>Store.insert("Service",{ClientId:clientId,InteractionId:it.Id,Date:it.Date,ServiceType:st,Minutes:m,MeetingType:it.MeetingType}))}
const durToMin=d=>{if(!d)return"";const p=String(d).split(":").map(Number);if(p.some(isNaN))return"";const sec=p.reduce((a,x)=>a*60+x,0);return Math.max(1,Math.ceil(sec/60))};
function dosage(clientId){
 const its=Store.where("Interaction",x=>x.ClientId===clientId&&x.Minutes>0), sv=Store.where("Service",x=>x.ClientId===clientId);
 return{contacts:its.length,minutes:its.reduce((a,x)=>a+x.Minutes,0),types:[...new Set(sv.map(x=>x.ServiceType))],referrals:Store.where("Referral",x=>x.ClientId===clientId).length};
}
const serviceTypes=()=>SIM.templates.service_types;
const meetingTypes=()=>SIM.templates.meeting_types;
/* The service log box, shown in the review panel of a new note and of an update. */
function logBox(log,pickServices){

   :`<p class="small muted" id="lg-svcs">Services covered: <b>${esc(log.services.join(", ")||"none yet")}</b>. These come from the needs' service types.</p>`}
 </div>`;
}
function wireLog(log,onChange){
 document.getElementById("lg-type").onchange=e=>{log.meeting_type=e.target.value;onChange()};

let SIM=null;

/* ---------- Activity log (spec section 4: feedback and data capture) ----------
   Shown on screen only, kept in memory for this session. No database. */
const ACTIVITY=[];
const clock=()=>{const t=new Date();return String(t.getHours()).padStart(2,"0")+":"+String(t.getMinutes()).padStart(2,"0")+":"+String(t.getSeconds()).padStart(2,"0")};
function logEvent(client,event,detail){ACTIVITY.unshift({at:clock(),ts:Date.now(),client:client||"",event,detail:detail||""})}
const secs=ms=>{const s=Math.round(ms/1000);return s<60?s+" sec":Math.floor(s/60)+" min "+(s%60)+" sec"};

function render(){

 app.querySelectorAll("[data-reset]").forEach(b=>b.onclick=()=>{Store.reset();state.sel="c1";state.newIds.clear();state.note=null;state.update=null;go(state.view==="clients"?"clients":"home");toast("Sample data restored.")});

 const c=CL.find(x=>x.id===state.sel)||CL[0];
 const rd=c.reminder?dayDiff(c.reminder.date):0;
 app.innerHTML=mock+`

   </table></div>
  </div>
  <div class="pane detail" id="detail">

    <div><h3 style="font-size:20px" id="detail-name">${esc(c.name)}</h3><p class="small muted">Client since ${fmt(c.since)} · ${statusTag(c.status)}</p></div>

   ${(d=>`<div class="dosage" id="dosage"><span><b>${d.contacts}</b> contacts</span><span><b>${d.minutes}</b> min</span><span><b>${d.types.length}</b> service types</span><span><b>${d.referrals}</b> referrals</span></div>`)(dosage(c.id))}
   ${c.needs.length?`<h2 style="margin-top:6px">Open needs</h2><ul class="small" id="needs-list" style="margin:0 0 12px;padding-left:18px">${c.needs.map((n,i)=>`<li>${esc(n)}${c.needTypes[i]?` <span class="tag info">${esc(c.needTypes[i])}</span>`:""}</li>`).join("")}</ul>`:""}

 </div>`;

  .map(([k,t])=>{const r=P[k]||SIM.typed_text_processing[k];return{t,status:r.status,r:r.result.replace("{duration}",src.dur||"the recording")}});

  if(i>0){const s=stages[i-1],li=lis[i-1];li.className=s.status==="skip"?"skip":s.status==="flag"?"flag":"done";li.querySelector(".dot").textContent=s.status==="skip"?"–":s.status==="flag"?"!":"✓";li.querySelector(".res").hidden=false}
  if(i<lis.length){lis[i].className="run";lis[i].querySelector(".dot").textContent="";i++;procTimer=setTimeout(step,stages[i-1].status==="skip"?400:1000)}
  else{const b=document.getElementById("seenote");b.hidden=false;b.focus()}
 };

/* ---------- Next steps rules (docs/specs/step1-next-steps.md) ----------
   Agreed steps need the line where someone committed; suggestions need a need they address,
   never cover a need an agreed step already covers, are ordered by need priority, at most 5. */
const MAX_SUGGESTIONS=5;
const needCat=t=>String(t).split(":")[0].trim();
function applyStepRules(note){
 const pr={Urgent:0,Soon:1,Later:2};
 const needPri=c=>{const x=note.immediate_needs.find(x=>needCat(x.text)===c);return x?pr[x.priority]??3:3};
 const steps=note.next_steps.map(x=>({kind:x.kind||"suggested",text:x.action||x.text,owner:x.owner||"Case manager",due:x.due||"",addresses:x.addresses||[],source:x.source||null,creates_reminder:!!x.creates_reminder}));
 steps.forEach(x=>{if(x.kind==="agreed"&&!x.source)x.kind="suggested"});
 const agreed=steps.filter(x=>x.kind==="agreed");
 const covered=new Set(agreed.flatMap(x=>x.addresses));
 const sug=steps.filter(x=>x.kind==="suggested"&&x.addresses.length&&!x.addresses.every(a=>covered.has(a)))
  .sort((a,b)=>Math.min(...a.addresses.map(needPri))-Math.min(...b.addresses.map(needPri))).slice(0,MAX_SUGGESTIONS);
 note.next_steps=[...agreed.map(x=>({...x,ticked:true})),...sug.map(x=>({...x,ticked:false}))];
 note.noneConfirmed=false;
}

  n.next_steps.filter(x=>x.added).forEach(x=>logEvent(nm,"Next step added",x.text));
  n.next_steps.filter(x=>x.kind==="suggested").forEach(x=>logEvent(nm,x.ticked?"Suggestion accepted":"Suggestion declined",x.text));
  n.next_steps.filter(x=>x.kind==="agreed"&&!x.ticked).forEach(x=>logEvent(nm,"Agreed step not saved",x.text));
  if(makesReminder)logEvent(nm,"Reminder created",`${r.type}, ${fmt(parseDate(r.date))}: ${r.text}`);
  logEvent(nm,"Note approved",`${secs(Date.now()-n.startedAt)} from upload to approval · ${n.edits} edit${n.edits===1?"":"s"} · ${n.tsOpened} time stamp${n.tsOpened===1?"":"s"} opened`);
  Store.save();
  state.sel=c.Id;state.newIds.add(c.Id);state.editing=false;go("services");toast(`Saved. ${nm} is now in your clients. Next: match services.`);
 };
}
function syncNote(){
 const n=state.note;if(!n)return;
 const who=n.key_info.name.value;
 keyFields(n.template).forEach(([f,label])=>{const el=document.getElementById("k-"+f);if(el&&el.value!==n.key_info[f].value){logEvent(who,"Field edited",`${label}: "${n.key_info[f].value||"blank"}" → "${el.value||"blank"}"`);n.edits++;n.key_info[f].value=el.value}});
 app.querySelectorAll("[data-owner]").forEach(el=>{const x=n.next_steps[+el.dataset.owner];if(x&&el.value!==x.owner){logEvent(who,"Step owner changed",`${x.text}: ${x.owner} → ${el.value}`);n.edits++;x.owner=el.value}});
 app.querySelectorAll("[data-due]").forEach(el=>{const x=n.next_steps[+el.dataset.due];const v=el.value.trim();if(x&&v!==x.due){logEvent(who,"Step due changed",`${x.text}: "${x.due||"not said"}" → "${v||"not said"}"`);n.edits++;x.due=v}});
 app.querySelectorAll("[data-list]").forEach(el=>{const it=n[el.dataset.list][+el.dataset.i];const t=el.textContent.trim();if(it&&t!==it.text){if(!it.added){logEvent(who,el.dataset.list==="immediate_needs"?"Need edited":"Next step edited",`"${it.text}" → "${t}"`);n.edits++}it.text=t}});
}

/* ---------- Existing client update ---------- */
function renderUpdate(){
 const u=state.update,c=u.client,S=u.source;
 app.innerHTML=mock+`
 <div class="notehead"><div><p class="small muted">${esc(c.name)} · ${esc(u.type)}</p><h1>Update to case file</h1></div>
  <div class="btns"><button class="btn" id="btn-back" type="button">Back to clients</button></div></div>
 <div class="notegrid">
  ${txPane(u.transcript,S)}
  <div class="pane note">
   <section><h4>Summary</h4><p contenteditable="true" id="usum" style="border-radius:3px;outline:1px dashed var(--line);padding:4px 6px">${esc(u.summary)}</p><p class="small muted" style="margin-top:4px">Click the text to edit it.</p></section>
   <section><h4>Changes to the case file <span class="tag info">${u.changes.length}</span></h4>
    <ul class="diff">${u.changes.map((ch,i)=>`<li><span class="k ${ch.kind==="add"?"add":"chg"}">${ch.kind==="add"?"Add":"Change"}</span><label class="chk"><input type="checkbox" checked data-keep="${i}"> <span><b>${esc(ch.label)}:</b> ${ch.from?`<s>${esc(ch.from)}</s> → `:ch.field==="status"?`<s>${esc(c.status)}</s> → `:""}${esc(ch.to)} ${srcBtn(ch.source,u.transcript,S)}</span></label></li>`).join("")}</ul>
    <p class="small muted" style="margin-top:8px">Untick anything you don't want added.</p></section>
  </div>
  <div class="pane review">
   <h2>Review check</h2>
   <div class="checks">
    <div class="auto ${u.log.minutes>0&&u.log.services.length?"y":"n"}" id="chk-log"><i>${u.log.minutes>0&&u.log.services.length?"✓":"!"}</i><span>${u.log.minutes>0&&u.log.services.length?"Service log complete":"Add minutes and at least one service"}</span></div>
    ${logBox(u.log,true)}
    <label class="chk"><input type="checkbox" id="urv"> I checked these changes against the ${S.kind==="audio"?"recording":"notes"}</label>
   </div>
   <button class="btn primary" id="usave" type="button" style="width:100%" disabled>Add to case file</button>
  </div>
 </div>`;
 wireSrc();
 const sv=document.getElementById("usave");
 const logOk=()=>u.log.minutes>0&&u.log.services.length>0;
 const refresh=()=>{const ok=logOk(),m=document.getElementById("chk-log");m.className="auto "+(ok?"y":"n");m.innerHTML=`<i>${ok?"✓":"!"}</i><span>${ok?"Service log complete":"Add minutes and at least one service"}</span>`;sv.disabled=!(ok&&document.getElementById("urv").checked)};
 document.getElementById("urv").onchange=e=>{refresh();logEvent(c.name,e.target.checked?"Review box ticked":"Review box unticked",u.type)};
 wireLog(u.log,refresh);
 document.getElementById("btn-back").onclick=()=>go("clients");
 sv.onclick=()=>{
  const keep=[...app.querySelectorAll("[data-keep]")].map(x=>x.checked);
  const it=Store.insert("Interaction",{ClientId:c.id,Date:TODAY_ISO,Type:u.type,Summary:document.getElementById("usum").textContent.trim(),Channel:S.kind==="audio"?"Voice note":"Typed",Template:u.type+" update",SourceName:S.name||null,MeetingType:u.log.meeting_type,Minutes:u.log.minutes});
  logServices(c.id,it,u.log.services);
  let newRem=null;
  u.changes.forEach((ch,i)=>{if(!keep[i])return;
   if(ch.field==="status")Store.update("Client",c.id,{Status:ch.to});
   if(ch.field==="need"){const ex=ch.from&&Store.all("Need").find(x=>x.ClientId===c.id&&x.Status==="Open"&&x.Text===ch.from);
    if(ex)Store.update("Need",ex.Id,{Text:ch.to,...(ch.service_type?{ServiceType:ch.service_type}:{})});else Store.insert("Need",{ClientId:c.id,Text:ch.to,ServiceType:ch.service_type||"",Priority:"Soon",Status:"Open",CreatedDate:TODAY_ISO,InteractionId:it.Id})}
   if(ch.field==="note"&&ch.label==="Next step")Store.insert("Goal",{ClientId:c.id,Text:ch.to,Type:"Next step",DueDate:null,Status:"Open",InteractionId:it.Id});
   if(ch.field==="reminder")newRem=ch.reminder;
  });
  /* Logging an update answers the client's open reminders; the update's own reminder (if kept) becomes the next one. */
  Store.where("Goal",g=>g.ClientId===c.id&&g.Status==="Open"&&g.DueDate).forEach(g=>Store.update("Goal",g.Id,{Status:"Done",CompletedDate:TODAY_ISO}));
  if(newRem)Store.insert("Goal",{ClientId:c.id,Text:newRem.text,Type:newRem.type,DueDate:newRem.date,Status:"Open",InteractionId:it.Id});
  approve(it.Id,`I checked these changes against the ${S.kind==="audio"?"recording":"notes"}`);
  u.changes.forEach((ch,i)=>logEvent(c.name,keep[i]?"Change accepted":"Change removed",`${ch.label}: ${ch.to}`));
  if(newRem)logEvent(c.name,"Reminder created",`${newRem.type}, ${fmt(parseDate(newRem.date))}: ${newRem.text}`);
  logEvent(c.name,"Update approved",`${u.type} · ${secs(Date.now()-u.startedAt)} from upload to approval`);
  Store.save();
  state.sel=c.id;state.newIds.add(c.id);go("clients");toast(`Added to ${c.name}'s case file.`);
 };
}
